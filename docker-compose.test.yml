services:
    smtp-test:
        image: axllent/mailpit:v1.28.0
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/livez"]
            interval: 1s
            timeout: 3s
            retries: 30
    postgres-test:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: flibusta_test
            POSTGRES_PASSWORD: flibusta_test
            POSTGRES_DB: flibusta_test
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U flibusta_test -d flibusta_test"]
            interval: 1s
            timeout: 3s
            retries: 30
    test:
        build:
            context: .
            dockerfile: phpdocker/php-fpm/Dockerfile
        working_dir: /application
        volumes:
            - ./application:/application:ro
            - ./README.md:/project/README.md:ro
            - ./phpdocker/pg/init_db.sql:/project/init_db.sql:ro
            - ./docker-compose.yml.sample:/project/docker-compose.yml.sample:ro
            - ./phpdocker/nginx/nginx.conf:/tmp/nginx.conf:ro
        environment:
            FLIBUSTA_DBTYPE: postgres
            FLIBUSTA_DBHOST: postgres-test
            FLIBUSTA_DBNAME: flibusta_test
            FLIBUSTA_DBUSER: flibusta_test
            FLIBUSTA_DBPASSWORD: flibusta_test
            FLIBUSTA_SMTP_HOST: smtp-test
            FLIBUSTA_SMTP_PORT: 1025
            FLIBUSTA_SMTP_TLS: none
            FLIBUSTA_SMTP_FROM: library@example.test
            FLIBUSTA_SMTP_TO: reader@example.test
        depends_on:
            postgres-test:
                condition: service_healthy
            smtp-test:
                condition: service_healthy
        command: >
            sh -ec 'php /application/tools/app_migrate.php &&
            find /application -path /application/vendor -prune -o -name "*.php" -type f -exec php -l {} \; &&
            php -d pcov.enabled=1 -d pcov.directory=/application /opt/flibusta-vendor/bin/phpunit -c /application/phpunit.xml --coverage-clover /tmp/php-coverage.xml &&
            php /application/tests/check_coverage.php /tmp/php-coverage.xml &&
            php /application/tests/http_integration.php &&
            COVERAGE_FILE=/tmp/python-coverage coverage run --include=/application/tools/epub_to_fb2.py -m unittest discover -s /application/tests/python -p "test*.py" &&
            COVERAGE_FILE=/tmp/python-coverage coverage report --fail-under=80 &&
            PYTHONPYCACHEPREFIX=/tmp/pycache python3 -m compileall -q /application/tools/epub_to_fb2.py &&
            sh -n /application/tools/app_import_sql.sh /application/tools/app_topg /application/tools/app_reindex.sh'
    nginx-test:
        image: nginx:1.27-alpine
        volumes:
            - ./phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
            - php-fpm:127.0.0.1
        command: ["nginx", "-t"]
    epub-converter:
        user: '${APPUSER_PUID:-1026}:${APPUSER_PGID:-100}'
        build:
            context: .
            dockerfile: phpdocker/worker/Dockerfile
        network_mode: none
        read_only: true
        mem_limit: 768m
        pids_limit: 128
        profiles: ["conversion"]
        volumes:
            - ./application:/application:ro
        entrypoint: ["python3", "/application/tests/conversion_integration.py"]
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=768m
