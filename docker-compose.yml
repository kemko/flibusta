services:
    postgres:
        build: phpdocker/pg
        working_dir: /application
        volumes:
            - 'db-data:/var/lib/postgresql/data'
            - './application:/application'
        environment:
            - POSTGRES_USER=flibusta
            - POSTGRES_PASSWORD=flibusta
            - POSTGRES_DB=flibusta
        ports:
            - '27101:5432'

    webserver:
        image: 'nginx:alpine'
        working_dir: /application
        volumes:
            - './application:/application'
            - './cache:/application/cache'
            - './Flibusta.Net:/application/flibusta'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '27100:80'

    php-fpm:
        build:
            context: .
            dockerfile: phpdocker/php-fpm/Dockerfile
        working_dir: /application
        volumes:
            - './application:/application'
            - './cache:/application/cache'
            - './Flibusta.Net:/application/flibusta'
            - './FlibustaSQL:/application/sql'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/local-custom.ini'
            - './phpdocker/php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-php-fpm.conf'
        environment:
            - FLIBUSTA_DBUSER=flibusta
            - FLIBUSTA_DBNAME=flibusta
            - FLIBUSTA_DBTYPE=postgres
            - FLIBUSTA_MAX_ARCHIVE_BYTES=${FLIBUSTA_MAX_ARCHIVE_BYTES:-1073741824}
            - FLIBUSTA_MAX_ENTRY_BYTES=${FLIBUSTA_MAX_ENTRY_BYTES:-104857600}
            - FLIBUSTA_DBHOST=postgres
            - FLIBUSTA_DBPASSWORD_FILE=/run/secrets/FLIBUSTA_PWD
            - FLIBUSTA_PUBLIC_URL=${FLIBUSTA_PUBLIC_URL:-}
            - FLIBUSTA_WEBROOT=${FLIBUSTA_WEBROOT:-}
            - FLIBUSTA_OIDC_ISSUER=${FLIBUSTA_OIDC_ISSUER:-}
            - FLIBUSTA_OIDC_CLIENT_ID=${FLIBUSTA_OIDC_CLIENT_ID:-}
            - FLIBUSTA_OIDC_CLIENT_SECRET_FILE=/run/secrets/FLIBUSTA_OIDC_CLIENT_SECRET
            - FLIBUSTA_OPDS_OWNER_HMAC_KEY_FILE=/run/secrets/FLIBUSTA_OPDS_OWNER_HMAC_KEY
            - FLIBUSTA_SMTP_HOST=${FLIBUSTA_SMTP_HOST:-}
            - FLIBUSTA_SMTP_PORT=${FLIBUSTA_SMTP_PORT:-587}
            - FLIBUSTA_SMTP_TLS=${FLIBUSTA_SMTP_TLS:-starttls}
            - FLIBUSTA_SMTP_USER=${FLIBUSTA_SMTP_USER:-}
            - FLIBUSTA_SMTP_PASSWORD_FILE=/run/secrets/FLIBUSTA_SMTP_PASSWORD
            - FLIBUSTA_SMTP_FROM=${FLIBUSTA_SMTP_FROM:-}
            - FLIBUSTA_SMTP_TO=${FLIBUSTA_SMTP_TO:-}
        secrets:
            - FLIBUSTA_SMTP_PASSWORD
            - FLIBUSTA_PWD
            - FLIBUSTA_OIDC_CLIENT_SECRET
            - FLIBUSTA_OPDS_OWNER_HMAC_KEY

    book-worker:
        user: '82:82'
        build:
            context: .
            dockerfile: phpdocker/php-fpm/Dockerfile
        working_dir: /application
        volumes:
            - './application:/application'
            - './Flibusta.Net:/application/flibusta'
            - './cache:/application/cache'
        environment:
            - FLIBUSTA_DBUSER=flibusta
            - FLIBUSTA_DBNAME=flibusta
            - FLIBUSTA_DBTYPE=postgres
            - FLIBUSTA_MAX_ARCHIVE_BYTES=${FLIBUSTA_MAX_ARCHIVE_BYTES:-1073741824}
            - FLIBUSTA_MAX_ENTRY_BYTES=${FLIBUSTA_MAX_ENTRY_BYTES:-104857600}
            - FLIBUSTA_DBHOST=postgres
            - FLIBUSTA_DBPASSWORD_FILE=/run/secrets/FLIBUSTA_PWD
            - FLIBUSTA_SMTP_HOST=${FLIBUSTA_SMTP_HOST:-}
            - FLIBUSTA_SMTP_PORT=${FLIBUSTA_SMTP_PORT:-587}
            - FLIBUSTA_SMTP_TLS=${FLIBUSTA_SMTP_TLS:-starttls}
            - FLIBUSTA_SMTP_USER=${FLIBUSTA_SMTP_USER:-}
            - FLIBUSTA_SMTP_PASSWORD_FILE=/run/secrets/FLIBUSTA_SMTP_PASSWORD
            - FLIBUSTA_SMTP_FROM=${FLIBUSTA_SMTP_FROM:-}
            - FLIBUSTA_SMTP_TO=${FLIBUSTA_SMTP_TO:-}
        secrets:
            - FLIBUSTA_PWD
            - FLIBUSTA_SMTP_PASSWORD
        command: >
            sh -ec 'while true; do
            php /application/tools/app_migrate.php;
            php /application/tools/app_scan_books.php;
            php /application/tools/app_worker.php;
            php /application/tools/app_worker.php --retry-errors;
            sleep 60;
            done'
        restart: unless-stopped

    compilation-converter:
        user: '82:82'
        build:
            context: .
            dockerfile: phpdocker/worker/Dockerfile
        working_dir: /work
        volumes:
            - './application:/application:ro'
            - './cache:/work'
        network_mode: none
        read_only: true
        mem_limit: 768m
        pids_limit: 128
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=768m
        entrypoint: ["/bin/sh", "-ec"]
        command: >
            while true; do
            for job in /work/compilations/work/*; do
            test -f "$$job/manifest.json" && php /application/tools/app_compilation_process.php "$$job" || true;
            done;
            sleep 2;
            done
        restart: unless-stopped


volumes:
    db-data:
secrets:
    FLIBUSTA_PWD:
        file: ./secrets/flibusta_pwd.txt
    FLIBUSTA_OIDC_CLIENT_SECRET:
        file: ./secrets/oidc_client_secret.txt
    FLIBUSTA_OPDS_OWNER_HMAC_KEY:
        file: ./secrets/opds_owner_hmac_key.txt
    FLIBUSTA_SMTP_PASSWORD:
        file: ./secrets/smtp_password.txt
